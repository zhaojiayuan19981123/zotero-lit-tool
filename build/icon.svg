<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a3da6"/>
      <stop offset="55%" stop-color="#81308C"/>
      <stop offset="100%" stop-color="#43184c"/>
    </linearGradient>
    <radialGradient id="glow" cx="22%" cy="16%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="win" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e9f5"/>
    </linearGradient>
    <linearGradient id="cursor" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#81308C"/>
      <stop offset="100%" stop-color="#b05cc0"/>
    </linearGradient>
  </defs>

  <!-- 背景 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>

  <!-- 终端窗口 -->
  <g filter="none">
    <rect x="88" y="128" width="336" height="256" rx="28" fill="url(#win)"/>
    <rect x="88" y="128" width="336" height="256" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="3"/>
    <!-- 标题栏圆点 -->
    <circle cx="130" cy="168" r="11" fill="#d9414e"/>
    <circle cx="164" cy="168" r="11" fill="#e8a213"/>
    <circle cx="198" cy="168" r="11" fill="#1a9e5c"/>
    <!-- 标题栏分隔线 -->
    <line x1="112" y1="196" x2="400" y2="196" stroke="#e8e2ee" stroke-width="3"/>
    <!-- > 提示符 -->
    <path d="M 138 240 L 190 282 L 138 324" fill="none" stroke="url(#cursor)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- _ 光标 -->
    <rect x="226" y="306" width="92" height="24" rx="12" fill="url(#cursor)"/>
    <!-- 文本行装饰 -->
    <rect x="138" y="348" width="150" height="14" rx="7" fill="#d9c6e0"/>
    <rect x="302" y="348" width="70" height="14" rx="7" fill="#e9dcef"/>
  </g>

  <!-- AI 星光（右上） -->
  <g fill="#ffd76e">
    <path d="M 396 84 L 406 116 L 438 126 L 406 136 L 396 168 L 386 136 L 354 126 L 386 116 Z"/>
    <path d="M 340 130 L 346 148 L 364 154 L 346 160 L 340 178 L 334 160 L 316 154 L 334 148 Z" fill="#ffffff" fill-opacity="0.9"/>
  </g>
</svg>
