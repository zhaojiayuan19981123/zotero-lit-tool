name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log

      # 作业日志只有仓库管理员能下载；注解是公开可读的，把失败的用例摘成注解发出去，
      # 这样在没登录的机器上也能看出是哪一条挂了（v1.37.0 第一次发版就卡在这里）。
      - name: Annotate test failures
        if: failure()
        shell: bash
        run: |
          grep -E "^not ok |^# fail |AssertionError|Error:|error:" test-output.log | tail -25 | while IFS= read -r line; do
            echo "::error::${line//$'\r'/}"
          done
          exit 1

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/worlex-setup-*.exe
            dist/worlex-setup-*.exe.blockmap
            dist/latest.yml

  macos:
    # ★ 2026-11-02 起 macos-14 镜像被 GitHub **正式退役**（10 月是分时段 brownout，
    #   11 月 2 日之后彻底不可用）。表现是作业在**分配阶段**就结束、0 秒、没有步骤、
    #   runner_name 为空，注解写着 `The configuration 'macos-14-arm64-us-default' is not supported`
    #   —— v1.38.0 第一次发版就因此少了两份 dmg。改用受支持的 macos-15（arm64 宿主，
    #   x64 由 electron-builder 交叉打包）。
    runs-on: macos-15
    # macOS 构建仍是「尽力而为」：平台偶发取消不该把整条流水线判红，所以标成允许失败，
    # 并且 release 作业用 always() 保证 Windows 那条链路照常发版。
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # ★ 关掉 electron-builder 的「硬链接」打包策略（v1.22.0 实测踩坑）。
      #   在非 Windows 上且处于 CI 时，electron-builder 默认把源码目录里的文件
      #   **硬链接**进 .app（builder-util/out/fs.js: _isUseHardLink = platform!=="win32"
      #   && CI && USE_HARD_LINKS!=="false"）。它的 link() 只容忍 EXDEV，
      #   一旦目标路径已存在就抛 EEXIST 并终止整个构建：
      #   `⨯ EEXIST: file already exists, link '.../server.js' -> '....app/Contents/Resources/app/server.js'`
      #   Windows 走的是复制分支（copyFile 会直接覆盖），所以同一个配置在 Windows 上一直是好的。
      #   置 false 后 macOS 与 Windows 走同一条经过验证的复制路径。
      USE_HARD_LINKS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          if-no-files-found: error
          path: dist/worlex-*-macos-${{ matrix.arch }}.dmg

  release:
    # 必须等 macOS 作业跑完：v1.35.0 实测，`needs: [windows]` 时 release 在 macOS 还没传
    # 制品时就发了，arm64 的 dmg 因此没进 Release（x64 只是恰好赶上）。
    # macOS 作业带 continue-on-error（构建机可能被平台取消），所以这里用 always() 保证
    # 它失败/取消时发版照常进行；但 windows 必须真的成功，否则不发。
    if: always() && startsWith(github.ref, 'refs/tags/v') && needs.windows.result == 'success'
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      # ★ 必须有 checkout：body_path 是相对**工作区**解析的，本作业若不检出源码，
      #   .github/release-body.md 就找不到 —— action-gh-release 只会打一条
      #   "Failed to read body_path ... (ENOENT)" 的警告然后静默发**空正文**的 Release
      #   （v1.12 / v1.13 / v1.15.0 / v1.15.1 / v1.16.0 都因此中招，每次都靠事后 PATCH 补）。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release notes file
        run: |
          test -s .github/release-body.md || {
            echo "::error::.github/release-body.md 缺失或为空，拒绝发出空正文的 Release"
            exit 1
          }

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: worlex ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          # 正文一律以 .github/release-body.md 为准，故 generate_release_notes 保持 false。
          # ⚠️ 更正：v1.16.0 从 CI 日志确认，历次「正文为空」的**真正**原因是本作业缺 checkout
          #    导致 body_path 读不到文件（ENOENT），与 generate_release_notes 无关。
          #    两个设置都保留即可 —— 但真正修复它的是上面的 Check out source + 文件非空校验。
          generate_release_notes: false
          body_path: .github/release-body.md
          files: release-assets/*
