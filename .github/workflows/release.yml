name: Build and publish release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Windows installer
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: |
            dist/zotero-lit-tool-setup-*.exe
            dist/zotero-lit-tool-setup-*.exe.blockmap
            dist/latest.yml

  macos:
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        arch:
          - arm64
          - x64
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # ★ 关掉 electron-builder 的「硬链接」打包策略（v1.22.0 实测踩坑）。
      #   在非 Windows 上且处于 CI 时，electron-builder 默认把源码目录里的文件
      #   **硬链接**进 .app（builder-util/out/fs.js: _isUseHardLink = platform!=="win32"
      #   && CI && USE_HARD_LINKS!=="false"）。它的 link() 只容忍 EXDEV，
      #   一旦目标路径已存在就抛 EEXIST 并终止整个构建：
      #   `⨯ EEXIST: file already exists, link '.../server.js' -> '....app/Contents/Resources/app/server.js'`
      #   Windows 走的是复制分支（copyFile 会直接覆盖），所以同一个配置在 Windows 上一直是好的。
      #   置 false 后 macOS 与 Windows 走同一条经过验证的复制路径。
      USE_HARD_LINKS: "false"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS DMG
        run: npx electron-builder --mac dmg --${{ matrix.arch }} --publish never

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-release
          if-no-files-found: error
          path: dist/zotero-lit-tool-*-macos-${{ matrix.arch }}.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      # ★ 必须有 checkout：body_path 是相对**工作区**解析的，本作业若不检出源码，
      #   .github/release-body.md 就找不到 —— action-gh-release 只会打一条
      #   "Failed to read body_path ... (ENOENT)" 的警告然后静默发**空正文**的 Release
      #   （v1.12 / v1.13 / v1.15.0 / v1.15.1 / v1.16.0 都因此中招，每次都靠事后 PATCH 补）。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify release notes file
        run: |
          test -s .github/release-body.md || {
            echo "::error::.github/release-body.md 缺失或为空，拒绝发出空正文的 Release"
            exit 1
          }

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: 一站式科研终端 ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          # 正文一律以 .github/release-body.md 为准，故 generate_release_notes 保持 false。
          # ⚠️ 更正：v1.16.0 从 CI 日志确认，历次「正文为空」的**真正**原因是本作业缺 checkout
          #    导致 body_path 读不到文件（ENOENT），与 generate_release_notes 无关。
          #    两个设置都保留即可 —— 但真正修复它的是上面的 Check out source + 文件非空校验。
          generate_release_notes: false
          body_path: .github/release-body.md
          files: release-assets/*
